# 效果描述 ( 名稱 / 排序 / 參數等 ), 欄位說明見 tool/maketext/build-effects.ls
order: 80
edit:
  fill:
    name: fill
    type: color
    default: '#f00'
  stroke:
    name: stroke
    type: color
    default: '#fff'
  extrusion:
    name: extrusion
    type: color
    default: '#900'
  innerShadow:
    name: inner shadow
    type: color
    default: '#000'
  shadow:
    name: shadow
    type: color
    default: '#444'
  depth:
    name: depth
    type: number
    default: 9
    min: 1
    max: 13
