    name: shadow dy
    type: number
    default: -1.2
    min: -10
    max: 10
    step: 0.1
  stddev:
    name: shadow spread
    type: number
    default: 2
    min: 0
    max: 20
    step: 0.01
  background:
    default: '#1db593'
