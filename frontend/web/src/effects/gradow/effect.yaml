# 效果描述 ( 名稱 / 排序 / 參數等 ), 欄位說明見 tool/maketext/build-effects.ls
order: 300
edit:
  color1:
    name: color1
    type: color
    default: '#f0f'
  color2:
    name: color2
    type: color
    default: '#0ff'
  shadow:
    name: shadow
    type: color
    default: '#fffcd9'
  offsetX:
    name: offset x
    type: number
    default: 4
    min: -50
    max: 50
    step: 0.1
  offsetY:
    name: offset y
    type: number
    default: 4
    min: -50
    max: 50
    step: 0.1
  direction:
    name: direction
    type: number
    default: 0
    min: 0
    max: 360
    step: 1
