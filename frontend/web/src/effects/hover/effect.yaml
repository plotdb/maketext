# 效果描述 ( 名稱 / 排序 / 參數等 ), 欄位說明見 tool/maketext/build-effects.ls
order: 10
edit:
  fill:
    name: fill
    type: color
    default: '#ffd5af'
  shadow:
    name: shadow
    type: color
    default: '#052b4a'
  offsetX:
    name: offset x
    type: number
    default: 4
    min: -50
    max: 50
    step: 0.1
  offsetY:
    name: offset y
    type: number
    default: 4
    min: -50
    max: 50
    step: 0.1
  background:
    default: '#596886'
