<!DOCTYPE html><html><head></head><body><h3>APP Error Information Page</h3><div></div><script>var ret,err,k,v;ret=document.cookie.split(";").map(function(r){var e;e=r.trim().split("=");return[e[0],decodeURIComponent(e[1])]}).filter(function(r){return r[0]==="lderror"})[0][1];if(ret){err="server lderror\n";ret=JSON.parse(ret);for(k in ret){v=ret[k];err+=" - "+k.padEnd(7," ")+"\t "+v+"\n"}console.error(err);document.querySelector("div").innerText="error id: "+ret.id+"\nuuid: "+ret.uuid}else{console.error("unknown server error");document.querySelector("div").innerText="unknow server error"}</script></body></html>
